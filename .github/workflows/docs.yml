name: Build and deploy MkDocs site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_search:
        description: Rebuild all semantic embeddings (ignore incremental cache)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . -r requirements-app.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned local search dependencies
        run: npm ci --prefix search

      - name: Restore pinned model assets
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: docs/pregunta/models
          key: semantic-model-${{ hashFiles('search/config.json') }}

      - name: Restore incremental embeddings
        id: index-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/semantic
          key: semantic-v1-${{ hashFiles('search/**', '!search/node_modules/**', 'docs/**/*.md') }}
          restore-keys: semantic-v1-

      - name: Prepare self-hosted model and browser runtime
        run: node search/prepare.mjs

      - name: Save verified model assets
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docs/pregunta/models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - name: Build coherent hybrid index
        env:
          FULL: ${{ inputs.rebuild_search || false }}
        run: |
          if [ "$FULL" = "true" ]; then
            node search/build.mjs --full
          else
            node search/build.mjs
          fi
          node search/evaluate.mjs
          node --test search/test.mjs
          node search/incremental-test.mjs

      - name: Save validated incremental embeddings
        if: steps.index-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/semantic
          key: ${{ steps.index-cache.outputs.cache-primary-key }}

      - name: Generate Ask the Handbook knowledge layer
        run: python scripts/generate_handbook_qa_knowledge.py

      - name: Verify generated knowledge and immutable runtime sources
        run: |
          python scripts/generate_handbook_qa_knowledge.py --check
          git diff --exit-code -- docs/assets/javascripts/handbook-qa.js docs/assets/stylesheets/handbook-qa.css
          if git ls-files --error-unmatch docs/assets/data/handbook-qa-catalog.json >/dev/null 2>&1; then
            echo "::error::Generated catalog must not be committed"; exit 1
          fi
          if git ls-files --error-unmatch docs/assets/data/handbook-section-index.json >/dev/null 2>&1; then
            echo "::error::Generated section index must not be committed"; exit 1
          fi

      - name: Run automated tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run Ask the Handbook JavaScript regressions
        run: |
          node tests/js/test_handbook_qa_engine.js
          node tests/js/test_handbook_qa_health_method_regression.js
          node tests/js/test_handbook_qa_quality_gate.js
          node tests/js/test_handbook_qa_benchmark.js

      - name: Generate P1 benchmark diagnostic
        run: node scripts/evaluate_handbook_qa_benchmark.js --output-dir artifacts

      - name: Upload P1 benchmark diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: ask-handbook-p1-benchmark
          path: |
            artifacts/handbook-qa-p1-report.json
            artifacts/handbook-qa-p1-report.md
          if-no-files-found: error

      - name: Audit documentation
        run: |
          python scripts/audit_docs.py
          python scripts/preflight_release.py

      - name: Check knowledge graph
        run: |
          npm install --no-save js-yaml@4.1.0 jsdom@30.1.3 marked@12.0.2 d3@7.9.0 dompurify@3.3.1
          node explorer/check_vault.js docs

      - name: Build MkDocs site
        run: python -m mkdocs build --strict

      - name: Check published knowledge graph
        run: node explorer/check_vault.js site/explorador/vault.json

      - name: Test explorer interactions
        run: node tests/js/test_explorer_ui.js

      - name: Verify local inference, citations and repository-prefix routing
        run: |
          node search/node_modules/playwright/cli.js install --with-deps chromium
          SEARCH_SITE_ROOT=site node search/browser-test.mjs
          node search/size-check.mjs
          node search/report.mjs

      - name: Upload semantic quality and privacy evidence
        uses: actions/upload-artifact@v4
        with:
          name: semantic-search-validation
          path: artifacts/semantic-*
          retention-days: 3
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
